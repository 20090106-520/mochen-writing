<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" role="img">
  <defs>
    <linearGradient id="column" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DFF4FB"/>
      <stop offset="0.42" stop-color="#AFDDEC"/>
      <stop offset="1" stop-color="#7FBAD6"/>
    </linearGradient>
    <radialGradient id="ceiling-light" cx="0.5" cy="0" r="0.72">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.5)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    <radialGradient id="corridor" cx="0.5" cy="0.52" r="0.5">
      <stop offset="0" stop-color="rgba(237, 249, 253, 0.66)"/>
      <stop offset="0.6" stop-color="rgba(237, 249, 253, 0.4)"/>
      <stop offset="1" stop-color="rgba(237, 249, 253, 0)"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.78">
      <stop offset="0.55" stop-color="rgba(0, 0, 0, 0)"/>
      <stop offset="1" stop-color="rgba(0, 0, 0, 0.1)"/>
    </radialGradient>

    <linearGradient id="shaft-380" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.14)"/>
      <stop offset="0.62" stop-color="rgba(255, 255, 255, 0.042)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>
    <linearGradient id="shaft-1920" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.14)"/>
      <stop offset="0.62" stop-color="rgba(255, 255, 255, 0.042)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.85)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </linearGradient>
    <linearGradient id="fore-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="rgba(29, 74, 97, 0)"/>
      <stop offset="0.38" stop-color="rgba(29, 74, 97, 0.9)"/>
      <stop offset="1" stop-color="#1D4A61"/>
    </linearGradient>
    <linearGradient id="whale-body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4E8FAE"/>
      <stop offset="0.55" stop-color="#2F6D8C"/>
      <stop offset="1" stop-color="#6BA6C2"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E7E9C"/>
      <stop offset="1" stop-color="#1E4C63"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(240, 184, 99, 0.95)"/>
      <stop offset="0.3" stop-color="rgba(240, 184, 99, 0.39899999999999997)"/>
      <stop offset="1" stop-color="rgba(240, 184, 99, 0)"/>
    </radialGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.5)"/>
      <stop offset="0.3" stop-color="rgba(255, 255, 255, 0.21)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#column)"/>
  <rect width="2560" height="1440" fill="url(#ceiling-light)"/>
  <rect x="700" y="150" width="1160" height="1140" fill="url(#corridor)"/>

  <g>
    <path d="M 380 0 L 530 0 L 650 1440 L 500 1440 Z" fill="url(#shaft-380)"/>
    <path d="M 1920 0 L 2030 0 L 1960 1440 L 1850 1440 Z" fill="url(#shaft-1920)"/>
  </g>
  <!-- 远处那层：海床上方一道极淡的雾脊，给画面一个「还有纵深」的读感。
       两端收成尖，不留竖直切口——原先那条 L 700 1140 的闭边在真机上读成一块面板。 -->
  <path d="M 0 1004 C 200 962, 430 1000, 640 1054 C 440 1104, 200 1112, 0 1082 Z" fill="rgba(203, 232, 243, 0.55)"/>
  <path d="M 2560 1004 C 2360 962, 2130 1000, 1920 1054 C 2120 1104, 2360 1112, 2560 1082 Z" fill="rgba(203, 232, 243, 0.55)"/>
  <!-- 鲸：左缘主体。背弧 → 头 → 下颌 → 腹 → 尾柄 → 两片尾鳍 -->
  <g>
    <path d="M 60 560 C 210 520, 400 552, 520 640 C 640 726, 700 826, 690 908
             C 676 1000, 560 1046, 430 1010 C 300 974, 190 880, 140 780
             C 110 720, 80 640, 60 560 Z" fill="url(#whale-body)"/>
    <!-- 尾鳍：从尾柄向左外翻的两片，画到画布外一半，读成「正在游远」 -->
    <path d="M 140 780 C 90 742, 40 690, 0 660 L 0 780 C 50 796, 100 812, 140 826 Z" fill="#2F6D8C"/>
    <path d="M 140 800 C 96 848, 54 906, 18 968 L 130 940 C 150 898, 156 848, 140 800 Z" fill="#2F6D8C"/>
    <!-- 胸鳍：腹下那一片，是「这是动物不是石头」的关键一件 -->
    <path d="M 430 1000 C 470 1046, 520 1082, 588 1100 C 540 1052, 500 1016, 470 984 Z" fill="#6BA6C2"/>
    <!-- 喉沟：鲸腹那几道纵纹，从下颌往后收 -->
    <g stroke="rgba(255, 255, 255, 0.22)" stroke-width="5" fill="none">
      <path d="M 250 900 C 340 962, 440 998, 560 1006"/>
      <path d="M 220 860 C 320 930, 430 968, 566 978"/>
      <path d="M 196 812 C 300 890, 420 934, 572 948"/>
    </g>
    <!-- 背脊高光：整条背一道渐隐的边光 -->
    <path d="M 70 574 C 220 534, 404 566, 524 652 C 636 734, 692 828, 684 902"
          fill="none" stroke="url(#rim)" stroke-width="9"/>
    <!-- 眼：头侧一枚，小但决定「认得出是活物」 -->
    <circle cx="596" cy="812" r="13" fill="rgba(255, 255, 255, 0.9)"/>
  </g>
  <!-- 小舟：右缘。船身月牙 + 舱里三摞稿纸 + 一根桅 + 船头那盏灯 -->
  <g>
    <path d="M 1900 1086 C 2010 1160, 2300 1164, 2470 1078 C 2400 1156, 2300 1194, 2180 1194
             C 2056 1194, 1952 1152, 1900 1086 Z" fill="url(#hull)"/>
    <path d="M 1900 1086 C 2020 1128, 2320 1128, 2470 1078" fill="none" stroke="rgba(255, 255, 255, 0.5)" stroke-width="6"/>
    <!-- 稿纸：三摞，每摞四张错开，边缘给一道亮边，读成纸而不是砖 -->
    <g fill="#FFFFFF">
      <path d="M 2010 1074 L 2140 1050 L 2148 1072 L 2018 1096 Z"/>
      <path d="M 2016 1046 L 2146 1022 L 2154 1044 L 2024 1068 Z"/>
      <path d="M 2022 1018 L 2152 994 L 2160 1016 L 2030 1040 Z"/>
      <path d="M 2028 990 L 2158 966 L 2166 988 L 2036 1012 Z"/>
      <path d="M 2200 1070 L 2330 1052 L 2336 1074 L 2206 1092 Z"/>
      <path d="M 2206 1044 L 2336 1026 L 2342 1048 L 2212 1066 Z"/>
      <path d="M 2212 1018 L 2342 1000 L 2348 1022 L 2218 1040 Z"/>
    </g>
    <g stroke="rgba(255, 255, 255, 0.34)" stroke-width="3" fill="none">
      <path d="M 2018 1096 L 2148 1072"/><path d="M 2206 1066 L 2342 1048"/>
    </g>
    <!-- 桅与灯 -->
    <path d="M 2402 1082 L 2412 792 L 2426 792 L 2432 1082 Z" fill="#1E4C63"/>
    <path d="M 2418 800 C 2330 830, 2296 892, 2318 950 C 2372 924, 2412 872, 2418 800 Z" fill="rgba(242, 250, 253, 0.9)"/>
    <path d="M 2418 800 C 2358 838, 2336 890, 2348 936" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="5"/>
  </g>
  <circle cx="2412" cy="770" r="17" fill="rgba(240, 184, 99, 0.96)"/>
    <circle cx="2412" cy="770" r="470" fill="url(#lamp)"/>
    <circle cx="240" cy="140" r="460" fill="url(#moon)"/>
  <!-- 前景压深：海面以下那一条，整幅最暗，给缩略图一个可抓的底。
       用渐变而不是硬边矩形——硬边在真机上是一条横贯全幅的「界面分割线」。 -->
  <rect x="0" y="1110" width="2560" height="330" fill="url(#fore-fade)"/>
  <path d="M 0 1180 C 220 1152, 470 1204, 700 1180 L 700 1210 C 470 1234, 220 1182, 0 1210 Z" fill="rgba(255, 255, 255, 0.3)"/>
  <path d="M 1860 1180 C 2090 1152, 2330 1204, 2560 1180 L 2560 1210 C 2330 1234, 2090 1182, 1860 1210 Z" fill="rgba(255, 255, 255, 0.3)"/>
  <!-- 灯在水面那道倒影：一条断开的竖直亮带 -->
  <g fill="rgba(240, 184, 99, 0.3)">
    <rect x="2398" y="1196" width="28" height="26" rx="13"/>
    <rect x="2404" y="1236" width="18" height="20" rx="10"/>
    <rect x="2396" y="1272" width="30" height="18" rx="9"/>
    <rect x="2408" y="1306" width="14" height="16" rx="8"/>
  </g>
